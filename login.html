<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yard Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height:100vh">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-4">Yard Management Login</h4>

          <div id="errorBox" class="alert alert-danger d-none">
            Invalid email or password
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control">
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" id="password" class="form-control">
          </div>

          <button class="btn btn-primary w-100" onclick="login()">Login</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCquNEhCHVkSKDcyOqcczE4eSY3lkrAgOk",
  authDomain: "yard-management-system-8e53a.firebaseapp.com",
  projectId: "yard-management-system-8e53a",
  storageBucket: "yard-management-system-8e53a.appspot.com",
  messagingSenderId: "268321054164",
  appId: "1:268321054164:web:b3188cc5080ad6f4ec8a41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Auto redirect if already logged in
onAuthStateChanged(auth, user => {
  if (user) window.location.replace("dashboard.html");
});

window.login = function () {
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const errorBox = document.getElementById("errorBox");

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  errorBox.classList.add("d-none");

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "dashboard.html";
    })
    .catch((err) => {
      console.error(err);
      errorBox.classList.remove("d-none");
    });
};
</script>

</body>
</html>
<style>

  background-color: #f0f4f8;
  color: #0d1b2a;
  font-family: 'Segoe UI', sans-serif;

  color: #1e3a8a; /* Dark blue headers */

  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

.card-header {
  background-color: #1e40af; /* Medium blue */
  color: white;
  font-weight: 600;
  font-size: 1rem;
}

.btn {
  border-radius: 8px;
  font-weight: 500;
}

.btn-success {
  background-color: #2563eb; /* Blue button instead of green */
  border-color: #2563eb;
}

.btn-success:hover {
  background-color: #1d4ed8;
  border-color: #1d4ed8;
}

.btn-outline-primary {
  color: #1e40af;
  border-color: #1e40af;
}

.btn-outline-primary:hover {
  background-color: #1e40af;
  color: white;
}

.btn-outline-danger {
  color: #dc2626;
  border-color: #dc2626;
}

.btn-outline-danger:hover {
  background-color: #dc2626;

}

.table thead {
  background-color: #2563eb;

}

.table-striped tbody tr:nth-of-type(odd) {

}

input.form-control {
  border-radius: 8px;

  padding: 0.5rem;
}

input.form-control:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

select.form-select {
  border-radius: 8px;
  border: 1px solid #93c5fd;
  padding: 0.5rem;
}

select.form-select:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

.card-body p, .card-body label {

}

.btn-danger {
  background-color: #ef4444;

}

.btn-danger:hover {

}
