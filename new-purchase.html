<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Purchase</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <h5 class="mb-0">➕ New Purchase</h5>
      <small class="text-muted">Enter purchase details</small>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Item Bought</label>
        <select id="item" class="form-select">
          <option value="">-- Select Item --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Weight (KG)</label>
        <input type="number" id="weight" class="form-control" step="0.01">
      </div>

      <div class="mb-3">
        <label class="form-label">Price per KG</label>
        <input type="number" id="price" class="form-control" step="0.01">
      </div>

      <div class="mb-3">
        <label class="form-label">Total Amount</label>
        <input type="text" id="total" class="form-control" readonly>
      </div>

      <div class="d-grid gap-2">
        <button class="btn btn-success" onclick="savePurchase()">
          💾 Save Purchase
        </button>

        <a href="dashboard.html" class="btn btn-outline-secondary">
          ⬅ Back
        </a>
      </div>

    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCquNEhCHVkSKDcyOqcczE4eSY3lkrAgOk",
  authDomain: "yard-management-system-8e53a.firebaseapp.com",
  projectId: "yard-management-system-8e53a",
  storageBucket: "yard-management-system-8e53a.appspot.com",
  messagingSenderId: "268321054164",
  appId: "1:268321054164:web:b3188cc5080ad6f4ec8a41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserData = null;

const itemSelect = document.getElementById("item");
const weightInput = document.getElementById("weight");
const priceInput = document.getElementById("price");
const totalInput = document.getElementById("total");

// 🔐 Protect page & load profile
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) {
    alert("Your account is not fully set up. Contact admin.");
    return;
  }

  currentUserData = {
    uid: user.uid,
    ...snap.data()
  };
});

// 📦 Load items into dropdown
async function loadItems() {
  const q = query(collection(db, "items"), where("active", "==", true));
  const snap = await getDocs(q);

  snap.forEach(docSnap => {
    const opt = document.createElement("option");
    opt.value = docSnap.data().name;
    opt.textContent = docSnap.data().name;
    itemSelect.appendChild(opt);
  });
}

loadItems();

// 🧮 Auto calculate total
function calculateTotal() {
  const weight = parseFloat(weightInput.value) || 0;
  const price = parseFloat(priceInput.value) || 0;
  const rawTotal = weight * price;
 
  totalInput.value = rawTotal.toLocaleString(undefined,{
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

weightInput.addEventListener("input", calculateTotal);
priceInput.addEventListener("input", calculateTotal);

// 💾 Save purchase
window.savePurchase = async function () {

  if (!currentUserData) {
    alert("User profile not loaded yet");
    return;
  }

  const item = itemSelect.value;
  const weight = parseFloat(weightInput.value);
  const price = parseFloat(priceInput.value);
  const total = parseFloat(totalInput.value.replace(/,/g, ""));

  if (!item || !weight || !price) {
    alert("Please fill all fields");
    return;
  }

  // ✅ Get today's date
  const dateToday = new Date().toISOString().split("T")[0]; // YYYY-MM-DD

  await addDoc(collection(db, "purchases"), {
    item,
    weightKg: weight,
    pricePerKg: price,
    total,
    date: dateToday,        // <-- added date for today.html
    attendantId: currentUserData.uid,
    attendantName: currentUserData.fullName,
    postName: currentUserData.postName,
    createdAt: serverTimestamp()
  });

  alert("Purchase saved successfully");
  window.location.href = "dashboard.html";
};
</script>

</body>
</html>
