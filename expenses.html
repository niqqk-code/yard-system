<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Expenses</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

<h5 class="mb-3">💸 Record Expense</h5>

<div class="card">
<div class="card-body">

<div class="mb-3">
<label>Expense Description</label>
<input type="text" id="description" class="form-control" placeholder="e.g. Transport, Lunch">
</div>

<div class="mb-3">
<label>Amount (KES)</label>
<input type="number" id="amount" class="form-control">
</div>

<button class="btn btn-danger w-100" id="saveExpense">Save Expense</button>
<a href="dashboard.html" class="btn btn-secondary w-100 mt-2">Back</a>

</div>
</div>
</div>

<script type="module">
import { auth, db } from "./assets/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const descInput = document.getElementById("description");
const amountInput = document.getElementById("amount");
const saveBtn = document.getElementById("saveExpense");

function today() {
  return new Date().toISOString().split("T")[0];
}

onAuthStateChanged(auth, user => { 
    if (!user) location.href = "login.html";
});

saveBtn.onclick = async () => {
  const user = auth.currentUser;
  if (!user) return;

  const description = descInput.value.trim();
  const amount = Number(amountInput.value || 0);

  if (!description || amount <= 0) {
    alert("Enter valid expense details");
    return;
  }

  await addDoc(collection(db, "expenses"), {
    attendantId: user.uid,
    description,
    amount,
    date: today(),
    createdAt: serverTimestamp()
  });

  alert("Expense saved");
  descInput.value = "";
  amountInput.value = "";
};
</script>

</body>
</html>
