<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <!-- USER CARD -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="mb-1" id="userName">Loading...</h5>
      <small class="text-muted">Post: <span id="postName">---</span></small>
      <p id="dayStatus" class="text-danger fw-bold mt-2"></p>
    </div>
  </div>

  <!-- PURCHASES -->
  <div class="card shadow-sm mb-4">
    <div class="card-header">🛒 Purchases</div>
    <div class="card-body">

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#yardTab">
            Yard Purchase
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#brokerTab">
            Broker Purchase
          </button>
        </li>
      </ul>

      <div class="tab-content">

        <!-- YARD PURCHASE -->
        <div class="tab-pane fade show active" id="yardTab">
          <a href="new-purchase.html" class="btn btn-success w-100">
            ➕ Add Yard Purchase
          </a>
        </div>

        <!-- BROKER PURCHASE -->
        <div class="tab-pane fade" id="brokerTab">

          <div class="mb-2">
            <input id="brokerName" class="form-control" placeholder="Broker Name">
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-4">
              <input id="brokerItem" class="form-control" placeholder="Item">
            </div>
            <div class="col-md-3">
              <input type="number" id="brokerWeight" class="form-control" placeholder="Weight (KG)">
            </div>
            <div class="col-md-3">
              <input type="number" id="brokerPrice" class="form-control" placeholder="Price/KG">
            </div>
            <div class="col-md-2">
              <input id="brokerTotal" class="form-control bg-light" readonly placeholder="Total">
            </div>
          </div>

          <!-- ✅ PAID BY DROPDOWN -->
          <div class="mb-2">
            <select id="brokerPaidBy" class="form-select">
              <option value="attendant">Paid by Attendant</option>
              <option value="yard_owner">Paid by Yard Owner</option>
            </select>
          </div>

          <button class="btn btn-primary w-100" id="addBrokerBtn">
            Add Broker Item
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="d-grid gap-3 mb-4">
    <a href="today.html" class="btn btn-outline-primary">📅 Today</a>
    <a href="cash.html" class="btn btn-outline-success">💰 Cash</a>
    <a href="expenses.html" class="btn btn-outline-danger">🧾 Expenses</a>
    <a href="walkin-sales.html" class="btn btn-outline-dark">🧍 Walk-In Sales</a>
  </div>

  <button class="btn btn-danger w-100" id="logoutBtn">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCquNEhCHVkSKDcyOqcczE4eSY3lkrAgOk",
  authDomain: "yard-management-system-8e53a.firebaseapp.com",
  projectId: "yard-management-system-8e53a"
});

const auth = getAuth(app);
const db = getFirestore(app);

const userNameEl = document.getElementById("userName");
const postNameEl = document.getElementById("postName");
const logoutBtn = document.getElementById("logoutBtn");

const brokerWeight = document.getElementById("brokerWeight");
const brokerPrice = document.getElementById("brokerPrice");
const brokerTotal = document.getElementById("brokerTotal");

function calcBroker(){
  brokerTotal.value =
    ((brokerWeight.value || 0) * (brokerPrice.value || 0)).toFixed(2);
}
brokerWeight.oninput = calcBroker;
brokerPrice.oninput = calcBroker;

onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href = "login.html";
    return;
  }

  userNameEl.textContent = user.email || "User";
  postNameEl.textContent = "Attendant";

  try{
    const snap = await getDoc(doc(db, "users", user.uid));
    if(snap.exists()){
      const data = snap.data();
      userNameEl.textContent = data.fullName || "Unnamed User";
      postNameEl.textContent = data.postName || "Attendant";
    }
  }catch(err){
    console.error(err);
  }

  document.getElementById("addBrokerBtn").onclick = async ()=>{
    if(!brokerName.value.trim()) return alert("Enter broker name");

    await addDoc(collection(db,"broker_purchases"),{
      brokerName: brokerName.value.trim(),
      item: brokerItem.value,
      weightKg: Number(brokerWeight.value||0),
      priceKg: Number(brokerPrice.value||0),
      total: Number(brokerTotal.value||0),
      paidBy: brokerPaidBy.value,   // ✅ IMPORTANT
      attendantId: user.uid,
      date: new Date().toISOString().split("T")[0],
      createdAt: serverTimestamp()
    });

    brokerItem.value = brokerWeight.value =
    brokerPrice.value = brokerTotal.value = "";
    alert("Broker purchase added");
  };
});

logoutBtn.onclick = ()=>signOut(auth).then(()=>location.href="login.html");
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<style>
/* ===== SYSTEM THEME: BLUE & WHITE ===== */

body {
  background-color: #f0f4f8;
  color: #0d1b2a;
  font-family: 'Segoe UI', sans-serif;
}

h4, h5, h6 {
  color: #1e3a8a; /* Dark blue headers */
}

.card {
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

.card-header {
  background-color: #1e40af; /* Medium blue */
  color: white;
  font-weight: 600;
  font-size: 1rem;
}

.btn {
  border-radius: 8px;
  font-weight: 500;
}

.btn-success {
  background-color: #2563eb; /* Blue button instead of green */
  border-color: #2563eb;
}

.btn-success:hover {
  background-color: #1d4ed8;
  border-color: #1d4ed8;
}

.btn-outline-primary {
  color: #1e40af;
  border-color: #1e40af;
}

.btn-outline-primary:hover {
  background-color: #1e40af;
  color: white;
}

.btn-outline-danger {
  color: #dc2626;
  border-color: #dc2626;
}

.btn-outline-danger:hover {
  background-color: #dc2626;
  color: white;
}

.table thead {
  background-color: #2563eb;
  color: white;
}

.table-striped tbody tr:nth-of-type(odd) {
  background-color: rgba(37, 99, 235, 0.1);
}

input.form-control {
  border-radius: 8px;
  border: 1px solid #93c5fd;
  padding: 0.5rem;
}

input.form-control:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

select.form-select {
  border-radius: 8px;
  border: 1px solid #93c5fd;
  padding: 0.5rem;
}

select.form-select:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

.card-body p, .card-body label {
  color: #0d1b2a;
}

.btn-danger {
  background-color: #ef4444;
  border-color: #ef4444;
}

.btn-danger:hover {
  background-color: #dc2626;
  border-color: #dc2626;
}

/* Highlight editable cells on hover */
td[contenteditable="true"]:hover {
  background-color: rgba(37, 99, 235, 0.1);
  outline: 1px solid #2563eb;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .row.g-2 > .col-md-*, .col-md-6, .col-md-3 {
    flex: 100%;
    max-width: 100%;
  }
}
</style>

</html>
