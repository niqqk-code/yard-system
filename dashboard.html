<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <!-- USER CARD -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="mb-1" id="userName">Loading...</h5>
      <small class="text-muted">Post: <span id="postName">---</span></small>
      <p id="dayStatus" class="text-danger fw-bold mt-2"></p>
    </div>
  </div>

  <!-- PURCHASES -->
  <div class="card shadow-sm mb-4">
    <div class="card-header">🛒 Purchases</div>
    <div class="card-body">

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#yardTab">
            Yard Purchase
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#brokerTab">
            Broker Purchase
          </button>
        </li>
      </ul>

      <div class="tab-content">

        <!-- YARD PURCHASE -->
        <div class="tab-pane fade show active" id="yardTab">
          <a href="new-purchase.html" class="btn btn-success w-100">
            ➕ Add Yard Purchase
          </a>
        </div>

        <!-- BROKER PURCHASE -->
        <div class="tab-pane fade" id="brokerTab">

          <div class="mb-2">
            <input id="brokerName" class="form-control" placeholder="Broker Name">
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-4">
              <input id="brokerItem" class="form-control" placeholder="Item">
            </div>
            <div class="col-md-3">
              <input type="number" id="brokerWeight" class="form-control" placeholder="Weight (KG)">
            </div>
            <div class="col-md-3">
              <input type="number" id="brokerPrice" class="form-control" placeholder="Price/KG">
            </div>
            <div class="col-md-2">
              <input id="brokerTotal" class="form-control bg-light" readonly placeholder="Total">
            </div>
          </div>

          <!-- ✅ PAID BY DROPDOWN -->
          <div class="mb-2">
            <select id="brokerPaidBy" class="form-select">
              <option value="attendant">Paid by Attendant</option>
              <option value="yard_owner">Paid by Yard Owner</option>
            </select>
          </div>

          <button class="btn btn-primary w-100" id="addBrokerBtn">
            Add Broker Item
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="d-grid gap-3 mb-4">
    <a href="today.html" class="btn btn-outline-primary">📅 Today</a>
    <a href="cash.html" class="btn btn-outline-success">💰 Cash</a>
    <a href="expenses.html" class="btn btn-outline-danger">🧾 Expenses</a>
    <a href="walkin-sales.html" class="btn btn-outline-dark">🧍 Walk-In Sales</a>
  </div>

  <button class="btn btn-danger w-100" id="logoutBtn">Logout</button>
</div>

<script type="module">
import { auth, db } from "./assets/firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const userNameEl = document.getElementById("userName");
const postNameEl = document.getElementById("postName");
const logoutBtn = document.getElementById("logoutBtn");

const brokerName = document.getElementById("brokerName");
const brokerItem = document.getElementById("brokerItem");
const brokerPaidBy = document.getElementById("brokerPaidBy");
const brokerWeight = document.getElementById("brokerWeight");
const brokerPrice = document.getElementById("brokerPrice");
const brokerTotal = document.getElementById("brokerTotal");

function calcBroker(){
  brokerTotal.value =
    ((brokerWeight.value || 0) * (brokerPrice.value || 0)).toFixed(2);
}
brokerWeight.oninput = calcBroker;
brokerPrice.oninput = calcBroker;

onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href = "login.html";
    return;
  }

  userNameEl.textContent = user.email || "User";
  postNameEl.textContent = "Attendant";

  try{
    const snap = await getDoc(doc(db, "users", user.uid));
    if(snap.exists()){
      const data = snap.data();
      userNameEl.textContent = data.fullName || "Unnamed User";
      postNameEl.textContent = data.postName || "Attendant";
    }
  }catch(err){
    console.error(err);
  }

  document.getElementById("addBrokerBtn").onclick = async ()=>{
    if(!brokerName.value.trim()) return alert("Enter broker name");

    await addDoc(collection(db,"broker_purchases"),{
      brokerName: brokerName.value.trim(),
      item: brokerItem.value,
      weightKg: Number(brokerWeight.value||0),
      priceKg: Number(brokerPrice.value||0),
      total: Number(brokerTotal.value||0),
      paidBy: brokerPaidBy.value,   // ✅ IMPORTANT
      attendantId: user.uid,
      date: new Date().toISOString().split("T")[0],
      createdAt: serverTimestamp()
    });

    brokerItem.value = brokerWeight.value =
    brokerPrice.value = brokerTotal.value = "";
    alert("Broker purchase added");
  };
});

logoutBtn.onclick = ()=>signOut(auth).then(()=>location.href="login.html");
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
