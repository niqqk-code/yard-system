<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <!-- USER CARD -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="mb-1" id="userName">Loading...</h5>
      <small class="text-muted">Post: <span id="postName">---</span></small>
      <p id="dayStatus" class="text-danger fw-bold mt-2"></p>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="d-grid gap-3 mb-4">
    <a href="new-purchase.html" class="btn btn-success">➕ New Purchase</a>
    <a href="today.html" class="btn btn-outline-primary">📅 Today</a>
    <a href="cash.html" class="btn btn-outline-success">💰 Cash</a>
    <a href="expenses.html" class="btn btn-outline-danger">🧾 Expenses</a>
  </div>

  <!-- LOGOUT -->
  <button class="btn btn-danger w-100" id="logoutBtn">Logout</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCquNEhCHVkSKDcyOqcczE4eSY3lkrAgOk",
  authDomain: "yard-management-system-8e53a.firebaseapp.com",
  projectId: "yard-management-system-8e53a",
  storageBucket: "yard-management-system-8e53a.appspot.com",
  messagingSenderId: "268321054164",
  appId: "1:268321054164:web:b3188cc5080ad6f4ec8a41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const userNameEl = document.getElementById("userName");
const postNameEl = document.getElementById("postName");
const dayStatusEl = document.getElementById("dayStatus");
const logoutBtn = document.getElementById("logoutBtn");

// Get today string
function todayString() {
  return new Date().toISOString().split("T")[0];
}

// Check if day is closed
async function isDayClosed(uid) {
  const ref = doc(db, "cash_sessions", uid + "_" + todayString());
  const snap = await getDoc(ref);
  return snap.exists() && snap.data().closed === true;
}

// On auth state change
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }

  try {
    // Load user profile
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists() || snap.data().active === false) {
      alert("Your account is disabled or missing. Contact admin.");
      signOut(auth).then(() => window.location.replace("login.html"));
      return;
    }

    const data = snap.data();

    // ⚠️ Check role
    if (data.role === "admin") {
      window.location.replace("admin.html");
      return;
    }

    // Attendant dashboard
    userNameEl.textContent = data.fullName || "No Name";
    postNameEl.textContent = data.postName || "---";

    // Check if day is closed
    const closed = await isDayClosed(user.uid);
    if (closed) {
      document.querySelectorAll("a, button").forEach(el => {
        el.classList.add("disabled");
        el.setAttribute("aria-disabled", "true");
        el.style.pointerEvents = "none";
        el.style.opacity = "0.6";
      });
      dayStatusEl.textContent = "🔒 Day Closed";
    }

  } catch (err) {
    console.error("Error loading dashboard:", err);
    alert("Failed to load dashboard.");
  }
});

// Logout
logoutBtn.onclick = function() {
  signOut(auth)
    .then(() => window.location.replace("login.html"))
    .catch(err => {
      console.error("Logout failed:", err);
      alert("Logout failed. Try again.");
    });
};
</script>

</body>
<style>
/* ===== SYSTEM THEME: BLUE & WHITE ===== */

body {
  background-color: #f0f4f8;
  color: #0d1b2a;
  font-family: 'Segoe UI', sans-serif;
}

h4, h5, h6 {
  color: #1e3a8a; /* Dark blue headers */
}

.card {
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

.card-header {
  background-color: #1e40af; /* Medium blue */
  color: white;
  font-weight: 600;
  font-size: 1rem;
}

.btn {
  border-radius: 8px;
  font-weight: 500;
}

.btn-success {
  background-color: #2563eb; /* Blue button instead of green */
  border-color: #2563eb;
}

.btn-success:hover {
  background-color: #1d4ed8;
  border-color: #1d4ed8;
}

.btn-outline-primary {
  color: #1e40af;
  border-color: #1e40af;
}

.btn-outline-primary:hover {
  background-color: #1e40af;
  color: white;
}

.btn-outline-danger {
  color: #dc2626;
  border-color: #dc2626;
}

.btn-outline-danger:hover {
  background-color: #dc2626;
  color: white;
}

.table thead {
  background-color: #2563eb;
  color: white;
}

.table-striped tbody tr:nth-of-type(odd) {
  background-color: rgba(37, 99, 235, 0.1);
}

input.form-control {
  border-radius: 8px;
  border: 1px solid #93c5fd;
  padding: 0.5rem;
}

input.form-control:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

select.form-select {
  border-radius: 8px;
  border: 1px solid #93c5fd;
  padding: 0.5rem;
}

select.form-select:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
}

.card-body p, .card-body label {
  color: #0d1b2a;
}

.btn-danger {
  background-color: #ef4444;
  border-color: #ef4444;
}

.btn-danger:hover {
  background-color: #dc2626;
  border-color: #dc2626;
}

/* Highlight editable cells on hover */
td[contenteditable="true"]:hover {
  background-color: rgba(37, 99, 235, 0.1);
  outline: 1px solid #2563eb;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .row.g-2 > .col-md-*, .col-md-6, .col-md-3 {
    flex: 100%;
    max-width: 100%;
  }
}
</style>

</html>
