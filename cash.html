<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

<h5 class="mb-3">💰 Cash Control</h5>

<div class="card">
<div class="card-body">

<div class="mb-3">
<label>Opening Cash (KES)</label>
<input type="number" id="openingCash" class="form-control" readonly>
</div>

<div class="mb-3">
<label>Top Up Cash (KES)</label>
<input type="number" id="topUpCash" class="form-control">
</div>

<button class="btn btn-success w-100" id="saveBtn">Save Top-Up</button>
<a href="dashboard.html" class="btn btn-secondary w-100 mt-2">Back</a>

</div>
</div>
</div>

<script type="module">
import { auth, db } from "./assets/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc,
  updateDoc,
  arrayUnion,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const openingCashInput = document.getElementById("openingCash");
const topUpCashInput = document.getElementById("topUpCash");
const saveBtn = document.getElementById("saveBtn");

// Get today's date string
function today() {
  return new Date().toISOString().split("T")[0];
}

// ✅ Function to check if the day is closed
async function isDayClosed(uid) {
  const ref = doc(db, "cash_sessions", uid + "_" + today());
  const snap = await getDoc(ref);
  return snap.exists() && snap.data().closed === true;
}

// Load opening cash
async function loadOpeningCash(user) {
  const todayRef = doc(db, "cash_sessions", user.uid + "_" + today());
  const todaySnap = await getDoc(todayRef);

  if (todaySnap.exists()) {
    const data = todaySnap.data();
    openingCashInput.value = data.openingCash || 0;

    if (data.closed === true) {
      saveBtn.disabled = true;
      saveBtn.textContent = "🔒 Day Closed";
    }
    return;
  }

  // Load yesterday closing cash if today doesn't exist
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yString = yesterday.toISOString().split("T")[0];
  const yRef = doc(db, "cash_sessions", user.uid + "_" + yString);
  const ySnap = await getDoc(yRef);

  openingCashInput.value = ySnap.exists()
    ? ySnap.data().closingCash || 0
    : 0;
}

// Auth listener
onAuthStateChanged(auth, async user => {
  if (!user) location.href = "login.html";

  // ✅ Check if day is closed before anything else
  if (await isDayClosed(user.uid)) {
    alert("Day is closed. No more entries allowed.");
    saveBtn.disabled = true;
    saveBtn.textContent = "🔒 Day Closed";
  }

  await loadOpeningCash(user);
});

// Save top-up
saveBtn.onclick = async () => {
  const user = auth.currentUser;
  if (!user) return;

  const topUp = Number(topUpCashInput.value || 0);
  if (topUp <= 0) {
    alert("Enter a valid top-up amount");
    return;
  }

  const ref = doc(db, "cash_sessions", user.uid + "_" + today());
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      attendantId: user.uid,
      openingCash: Number(openingCashInput.value),
      cashTopUps: [],
      date: today(),
      createdAt: serverTimestamp(),
      closed: false
    });
  }

  await updateDoc(ref, {
    cashTopUps: arrayUnion({
      amount: topUp,
      timestamp: new Date()
    })
  });

  alert("Top-up saved");
  topUpCashInput.value = "";
};
</script>

</body>
</html>
