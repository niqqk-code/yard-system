<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>End of Day Summary</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

  <h5 class="mb-3">📊 End of Day Summary</h5>

  <div class="card mb-3">
    <div class="card-body">
      <p><strong>Attendant:</strong> <span id="attendantName">Loading...</span></p>
      <p><strong>Post:</strong> <span id="postName">---</span></p>
      <p><strong>Date:</strong> <span id="todayDate">---</span></p>
    </div>
  </div>

  <!-- Totals Table -->
  <table class="table table-bordered bg-white mb-3">
    <thead>
      <tr>
        <th>Metric</th>
        <th>Amount (KES)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Total Purchases</td>
        <td id="totalPurchases">0.00</td>
      </tr>
      <tr>
        <td>Total Expenses</td>
        <td id="totalExpenses">0.00</td>
      </tr>
      <tr>
        <td>Total Cash Top-Ups</td>
        <td id="totalTopUps">0.00</td>
      </tr>
      <tr>
        <td>Opening Cash</td>
        <td id="openingCash">0.00</td>
      </tr>
      <tr>
        <td><strong>Closing Cash</strong></td>
        <td id="closingCash">0.00</td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-success w-100" onclick="closeDay()">Close Day</button>
  <a href="dashboard.html" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>

</div>

<script type="module">
import { auth, db } from "./assets/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, doc, getDoc, query, where, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const attendantNameEl = document.getElementById("attendantName");
const postNameEl = document.getElementById("postName");
const todayDateEl = document.getElementById("todayDate");

const totalPurchasesEl = document.getElementById("totalPurchases");
const totalExpensesEl = document.getElementById("totalExpenses");
const totalTopUpsEl = document.getElementById("totalTopUps");
const openingCashEl = document.getElementById("openingCash");
const closingCashEl = document.getElementById("closingCash");

function today() {
  return new Date().toISOString().split("T")[0];
}

let currentUser = null;
let openingCash = 0;
let topUps = 0;
let totalPurchases = 0;
let totalExpenses = 0;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }
  currentUser = user;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (!userSnap.exists()) {
    alert("User profile missing.");
    window.location.replace("dashboard.html");
    return;
  }

  attendantNameEl.textContent = userSnap.data().fullName;
  postNameEl.textContent = userSnap.data().postName;
  todayDateEl.textContent = today();

  // Load opening cash & top-ups
  const cashSnap = await getDoc(doc(db, "cash_sessions", user.uid + "_" + today()));
  openingCash = cashSnap.exists() ? cashSnap.data().openingCash || 0 : 0;
  if (cashSnap.exists()) {
    const { cashTopUps } = cashSnap.data();
    topUps = Array.isArray(cashTopUps)
      ? cashTopUps.reduce((sum, t) => sum + Number(t?.amount || 0), 0)
      : Number(cashTopUps || 0);
  } else {
    topUps = 0;
  }

  openingCashEl.textContent = openingCash.toLocaleString();
  totalTopUpsEl.textContent = topUps.toLocaleString();

  // Load today's purchases
  const purchasesQ = query(collection(db, "purchases"), where("attendantId", "==", user.uid));
  const purchasesSnap = await getDocs(purchasesQ);
  totalPurchases = 0;
  purchasesSnap.forEach(p => {
    const data = p.data();
    const createdAt = data.createdAt?.toDate ? data.createdAt.toDate() : new Date();
    if (createdAt.toISOString().split("T")[0] === today()) {
      totalPurchases += data.total || 0;
    }
  });
  totalPurchasesEl.textContent = totalPurchases.toLocaleString();

  // Load today's expenses
  const expensesQ = query(collection(db, "expenses"), where("attendantId", "==", user.uid));
  const expensesSnap = await getDocs(expensesQ);
  totalExpenses = 0;
  expensesSnap.forEach(e => {
    const data = e.data();
    if (data.date === today()) totalExpenses += data.amount || 0;
  });
  totalExpensesEl.textContent = totalExpenses.toLocaleString();

  // Calculate closing cash
  const closing = openingCash + topUps - totalPurchases - totalExpenses;
  closingCashEl.textContent = closing.toLocaleString();
});

window.closeDay = async function() {
  if (!currentUser) return;
  const closing = openingCash + topUps - totalPurchases - totalExpenses;

  // Save closing cash for next day
  await setDoc(doc(db, "cash_sessions", currentUser.uid + "_" + today()), {
    closingCash: closing,
    closedAt: serverTimestamp()
  }, { merge:true });

  alert("Day closed successfully! Closing cash saved.");
};
</script>

</body>
</html>
